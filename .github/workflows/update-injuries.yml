name: Update NBA injuries JSON

on:
  workflow_dispatch:
  schedule:
    # Резервный запуск GitHub каждые 15 минут.
    # Основной стабильный запуск можно дополнительно держать через cron-job.org.
    # Минуты специально не 0/15/30/45, чтобы не попадать в самые загруженные точки часа.
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: nba-injuries-updater
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PHP and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-mbstring poppler-utils

      - name: Load current live JSON from aanba.info
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location --max-time 25 \
            "https://aanba.info/data/injuries.json?cache_bust=$(date +%s)" \
            -o data/injuries.json \
            && echo "Loaded current live JSON from aanba.info" \
            || echo "Live JSON was not downloaded; using repository copy as fallback"

      - name: Run updater
        run: php scripts/update_injuries.php

      - name: Show fresh timestamp
        run: |
          php -r '$data=json_decode(file_get_contents("data/injuries.json"), true); echo "last_updated=" . ($data["last_updated"] ?? "") . PHP_EOL; echo "records=" . count($data["items"] ?? []) . PHP_EOL;'

      - name: Upload injuries.json to SpaceWeb
        env:
          UPLOAD_BASE_URL: ${{ secrets.UPLOAD_BASE_URL }}
          UPLOAD_USERNAME: ${{ secrets.UPLOAD_USERNAME }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: |
          test -n "$UPLOAD_BASE_URL"
          test -n "$UPLOAD_USERNAME"
          test -n "$UPLOAD_PASSWORD"
          curl --fail --silent --show-error \
            --user "$UPLOAD_USERNAME:$UPLOAD_PASSWORD" \
            --ftp-create-dirs \
            -T data/injuries.json \
            "$UPLOAD_BASE_URL/data/injuries.json"

      - name: Upload updater log to SpaceWeb
        if: always()
        env:
          UPLOAD_BASE_URL: ${{ secrets.UPLOAD_BASE_URL }}
          UPLOAD_USERNAME: ${{ secrets.UPLOAD_USERNAME }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: |
          if [ -f logs/update_injuries.log ]; then
            curl --silent --show-error \
              --user "$UPLOAD_USERNAME:$UPLOAD_PASSWORD" \
              --ftp-create-dirs \
              -T logs/update_injuries.log \
              "$UPLOAD_BASE_URL/logs/update_injuries.log" || true
          fi
